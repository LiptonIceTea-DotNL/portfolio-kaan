<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(/images/north_america/north-america-background.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            color: lavender;
            text-shadow: 2px 1px black;
            font-size: 2em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        img {
            width: 400px;
            height: 300px;
            opacity: 80%;
        }

        section {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
        }
    </style>
    <title>Noord America</title>
</head>

<body>
    <header>
        <h1>Noord-America</h1>
    </header>
    <main>
        <p>Geniet van een metropolitaanse en ruige vakantie in Noord-America!</p>
        <section>
            <img src="/images/north_america/north-america-1.jpg" alt="Foto van bergen met water">
            <img src="/images/north_america/north-america-2.jpg" alt="Foto van heel scherpe rotsen">
            <img src="/images/north_america/north-america-3.jpg" alt="Foto van gebouwen in New York City">
            <img src="/images/north_america/north-america-4.jpg" alt="Foto van een park in New York City">
            <img src="/images/north_america/north-america-5.jpg" alt="Foto van een gladde berg">
            <img src="/images/north_america/north-america-6.jpg" alt="Foto van een afgrond">
        </section>
    </main>
</body>

</html>
