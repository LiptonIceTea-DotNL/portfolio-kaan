<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(images/asia/asia-background.webp);
            background-size: cover;
            background-repeat: no-repeat;
            background-color: #45403f;
            color: rgb(229, 158, 255);
            font-size: 2em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-shadow: 2px 1px black;
        }

        img {
            width: 400px;
            height: 300px;
            opacity: 85%;
        }

        section {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
        }
    </style>
    <title>Azie</title>
</head>

<body>
    <header>
        <h1>Azië</h1>
    </header>
    <main>
        <p>Geniet van een diverse en heerlijke vakantie in Azië!</p>
        <section>
            <img src="images/asia/azie-1.webp" alt="Foto van rijstvelden op bergen">
            <img src="images/asia/azie-2.jpg" alt="Foto van een archipel">
            <img src="images/asia/azie-3.jpg" alt="Foto van een tempel ">
            <img src="images/asia/azie-4.jpg" alt="Foto van een kleine dorp met 2 mensen die bergopwaarts lopen">
            <img src="images/asia/azie-5.jpg" alt="Foto van een berg met een top van sneeuw">
            <img src="images/asia/azie-6.jpg" alt="Foto van lantaarnen die de lucht in vliegen">
        </section>
    </main>
</body>

</html>
