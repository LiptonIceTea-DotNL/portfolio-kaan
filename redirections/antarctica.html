<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(images/antarctica/antarctica-background.webp);
            background-size: cover;
            background-repeat: no-repeat;
            background-color: #4b3c61;
            color: rgb(184, 243, 223);
            font-size: 2em;
            text-align: start;
            text-shadow: 2px 1px black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        img {
            width: 400px;
            height: 300px;
            opacity: 80%;
        }

        section {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
        }
    </style>
    <title>Antarctica</title>
</head>

<body>
    <header>
        <h1>Antarctica</h1>
    </header>
    <main>
        <p>Geniet van een spectaculaire en koude vakantie in het sneeuwgevulde Antarctica!</p>
        <section>
            <img src="/images/antarctica/antarctica-1.webp" alt="Foto van 3 personen die langs het water in sneeuwige bergen lopen">
            <img src="/images/antarctica/antarctica-2.jpg" alt="Foto van bergen in Antarctica">
            <img src="/images/antarctica/antarctica-3.jpg" alt="Foto van bergen in Antarctica die heel steil zijn">
            <img src="/images/antarctica/antarctica-4.jpg" alt="Foto van een sneeuwige afgrond langs het water">
            <img src="/images/antarctica/antarctica-5.jpg" alt="Foto van een berg langs het water">
            <img src="/images/antarctica/antarctica-6.jpg" alt="Foto van een koude en gladde oppervlakte van ijs met bergen in de achtergrond">
        </section>
    </main>
</body>

</html>
