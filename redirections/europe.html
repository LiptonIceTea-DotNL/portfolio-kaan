<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(/images/europe/europe-background.webp);
            background-size: cover;
            background-repeat: no-repeat;
            background-color: #273625;
            color: rgb(192, 255, 192);
            font-size: 2em;
            text-shadow: 2px 1px black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        img {
            width: 400px;
            opacity: 80%;
            height: 300px;
        }

        section {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
        }
    </style>
    <title>Europa</title>
</head>

<body>
    <header>
        <h1>Europa</h1>
    </header>
    <main>
        <p>Geniet van een historische en klassieke vakantie in Europa!</p>
        <section>
            <img src="/images/europe/europa-1.jpg" alt="Foto van een Griekse stad langs het water">
            <img src="/images/europe/europa-2.jpg" alt="Foto van een Duitse dorp met een kanaal">
            <img src="/images/europe/europa-3.jpg" alt="Foto van een Italiaanse stad van bovenaf">
            <img src="/images/europe/europa-4.jpg" alt="Foto van een kasteel langs het water">
            <img src="/images/europe/europa-5.jpg" alt="Foto van de coloseum in Rome">
            <img src="/images/europe/europa-6.webp" alt="Foto van een stad met een brug van bovenaf">
        </section>
    </main>
</body>

</html>
