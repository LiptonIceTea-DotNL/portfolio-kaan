<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(images/oceania/oceania-background.webp   );
            background-size: cover;
            background-repeat: no-repeat;
            background-color: #5a4d46;
            color: lavender;
            text-shadow: 2px 1px black;
            font-size: 2em;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        img {
            width: 400px;
            height: 300px;
            opacity: 80%;
        }

        section {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
        }
    </style>
    <title>Oceanie</title>
</head>

<body>
    <header>
        <h1>Oceanië</h1>
    </header>
    <main>
        <p>Geniet van een tropische en exotische vakantie in Oceanië!</p>
        <section>
            <img src="images/oceania/oceania-1.jpg" alt="Foto van 2 huizen op ondiep water naast een eiland">
            <img src="images/oceania/oceania-2.jpg" alt="Foto van een archipel">
            <img src="images/oceania/oceania-3.jpg" alt="Foto van een stad met grote gebouwen">
            <img src="images/oceania/oceania-4.jpg" alt="Foto van Moai standbeelden naast elkaar">
            <img src="images/oceania/oceania-5.jpg" alt="Foto van zonsondergang langs de kust">
            <img src="images/oceania/oceania-6.avif" alt="Foto van bergen met sneeuwige toppen">
        </section>
    </main>
</body>

</html>
