<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style__form.css">
    <script src="script.js" defer></script>
    <title>Formulier</title>
</head>

<body>
    <header>
        <nav class="nav-container">
            <img src="images/logo.png" alt="Logo van een rode planeet met KB erop">
            <a class="nav-links" href="index.html">Home</a>
            <a class="nav-links" href="images.html">Afbeeldingen</a>
            <a class="nav-links" href="form.html">Formulier</a>
            <a class="nav-links" href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <img>
        <section>
            <h1>Formulier</h1>
            <form>
                <fieldset>
                    <div class="text-container">
                        <label for="text-box">Wat vindt u leuk aan Schiedam?</label>
                        <br>
                        <input class="text" type="text" name="text-box">
                    </div>
                    <div class="continent-container">
                        <label class="continent-label">Kies een continent dat u aanspreekt:</label>
                        <br>
                        <div class="radio-container">
                            <label for="continent">Europa</label>
                            <input type="radio" name="continent" value="www.google.com" class="europe">
                            <label for="continent">Afrika</label>
                            <input type="radio" name="continent" value="www.google.com" class="africa">
                            <label for="continent">Azië</label>
                            <input type="radio" name="continent" value="www.google.com" class="asia">
                            <label for="continent">Oceanië</label>
                            <input type="radio" name="continent" value="www.google.com" class="oceania">
                            <label for="continent">Noord-Amerika</label>
                            <input type="radio" name="continent" value="www.google.com" class="north-america">
                            <label for="continent">Zuid-Amerika</label>
                            <input type="radio" name="continent" value="www.google.com" class="south-america">
                            <label for="continent">Antarctica</label>
                            <input type="radio" name="continent" value="www.google.com" class="antarctica">
                        </div>
                    </div>
                    <div class="capital-container">
                        <label for="capital-cities">Kies één of meer (of geen) steden rond de wereld die u zou willen
                            bezoeken:</label>
                        <label for="city-brazil">Rio de Janeiro</label>
                        <input type="checkbox" name="city-brazil" value="www.google.com" class="rio">
                        <label for="capital-japan">Tokyo</label>
                        <input type="checkbox" name="capital-japan" value="www.google.com" class="tokyo">
                        <label for="city-us">New York City</label>
                        <input type="checkbox" name="city-us" value="www.google.com" class="york">
                        <label for="capital-italy">Rome</label>
                        <input type="checkbox" name="capital-italy" value="www.google.com" class="rome">
                        <label for="city-australia">Sydney</label>
                        <input type="checkbox" name="city-australia" value="www.google.com" class="sydney">
                        <label for="capital-egypt">Cairo</label>
                        <input type="checkbox" name="capital-egypt" value="www.google.com" class="cairo">
                    </div>
                    <button class="submit-button">Gegevens invoeren</button>
                </fieldset>
            </form>
        </section>

        <article>
            <table>
                <caption>Landen waar ik ben geweest/zou willen reizen:</caption>
                <tr class="table-head">
                    <th>Geweest</th>
                    <th>Zou willen reizen</th>
                    <th>Te duur om te wonen</th>
                </tr>
                <tr>
                    <td>Spanje</td>
                    <td>Azerbeidzjan</td>
                    <td>Zwitserland</td>
                </tr>
                <tr>
                    <td>Turkije</td>
                    <td>Japan</td>
                    <td>Verenigde Staten</td>
                </tr>
                <tr>
                    <td>Duitsland</td>
                    <td>Finland</td>
                    <td>Liechtenstein</td>
                </tr>
            </table>
        </article>
    </main>
</body>

</html>
